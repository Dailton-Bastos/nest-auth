services:
  db:
    image: postgres
    container_name: nestjs-starter-postgres
    restart: always
    shm_size: 128mb
    ports:
      - '${POSTGRES_PORT}:5432'
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./pgdata:/var/lib/postgresql
    networks:
      - nestjs-starter-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: prerelease
    image: nestjs-starter-api:latest
    container_name: nestjs-starter-api
    env_file:
      - .env
    ports:
      - '${PORT}:${PORT}'
    volumes:
      - ./src:/usr/src/app/src
      - ./node_modules:/usr/src/app/node_modules
    command: yarn start:dev
    networks:
      - nestjs-starter-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:${PORT}/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4
    container_name: nestjs-starter-pgadmin
    restart: always
    ports:
      - '${PGADMIN_HOST_PORT}:${PGADMIN_CONTAINER_PORT}'
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      - db
    volumes:
      - ./pgadmin:/var/lib/pgadmin
    networks:
      - nestjs-starter-network

  # ========================================
  # Test Service
  # ========================================

  api-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    container_name: nestjs-starter-api-test
    env_file:
      - .env
    environment:
      - NODE_ENV=test
    volumes:
      - ./src:/usr/src/app/src
      - ./node_modules:/usr/src/app/node_modules
      - ./coverage:/usr/src/app/coverage
      - ./tsconfig.json:/usr/src/app/tsconfig.json
      - ./tsconfig.build.json:/usr/src/app/tsconfig.build.json
      - ./nest-cli.json:/usr/src/app/nest-cli.json
      - ./test:/usr/src/app/test
    networks:
      - nestjs-starter-network
    depends_on:
      db:
        condition: service_healthy

networks:
  nestjs-starter-network:
    driver: bridge
    name: nestjs-starter-network
